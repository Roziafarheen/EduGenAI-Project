<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie - AI Learning Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>EduGenie</h1>

        <p class="subtitle">
            Your AI-Powered Learning Assistant
        </p>

        <div class="card">

            <label for="task">Choose a task:</label>

            <select id="task">
                <option value="qa">Ask a Question</option>
                <option value="explain">Explain a Concept</option>
                <option value="quiz">Generate Quiz</option>
                <option value="summarize">Summarize Text</option>
                <option value="learn">Learning Path</option>
            </select>

            <label for="userInput">Enter your question or text:</label>

            <textarea
                id="userInput"
                placeholder="Type your question or learning content here..."
                rows="8">
            </textarea>

            <button id="submitButton">
                Submit
            </button>

            <div id="loading" class="loading hidden">
                Processing...
            </div>

            <div class="result-box">

                <h2>Result</h2>

                <div id="result">
                    Your result will appear here.
                </div>

            </div>

        </div>

    </div>

    <script src="/static/app.js"></script>

</body>
</html>
